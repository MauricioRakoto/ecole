<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecole</title>
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row" style="justify-content: center;">
           
            <form class="auth" action="#" style="height:  340px;">
                <div class="auth-l">
                    <div class="image" >
                        
                    </div>
                    
                </div>
                <div class="auth-r">
                    <div class="f-tp">
                        <div class="ttl">
                            <h3>Connecter à un compte</h3>
                        </div>
                        <div class="links">
                            <a href="./signin.html" class="link active">Se connecter</a>
                            <a href="./signup.html" class="link ">S'inscrire</a>
                        </div>
                    </div>
                    <div class="f-bd">
                        
                        <div class="form-group">
                            <div class="label">
                                <h4>Username</h4>
                            </div>
                            <div class="input">
                                <input type="text" placeholder="Username">
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="label">
                                <h4>Password</h4>
                            </div>
                            <div class="input">
                                <input type="text" placeholder="Password">
                            </div>
                        </div>
                    </div>
                    <div class="f-bt">
                        <button type="submit">S'inscrire</button>
                    </div>
                </div>
                
            </form>
           
        </div>
    </div>
</body>
</html>
